const TABLES = {
  students:'students', classes:'classes', schedules:'schedules',
  attendance:'attendance', payments:'payments', invoices:'invoices',
  notes:'notes', settings:'settings'
};

const FIELD_MAP = {
  students:{studentCode:'student_code',name:'name',nickname:'nickname',phone:'phone',
    parentName:'parent_name',parentPhone:'parent_phone',school:'school',
    schoolGrade:'school_grade',subject:'subject',level:'level',paymentType:'payment_type',
    customPrice:'custom_price',defaultPrice:'default_price',startDate:'start_date',

  classes:{className:'class_name',teacher:'teacher',subject:'subject',level:'level',

  attendance:{date:'date',classId:'class_id',studentId:'student_id',
    studentName:'student_name',className:'class_name',status:'status',notes:'notes'},
  payments:{studentId:'student_id',studentName:'student_name',className:'class_name',
    subject:'subject',level:'level',paymentType:'payment_type',periodStart:'period_start',
    periodEnd:'period_end',meetingNumber:'meeting_number',quantity:'quantity',month:'month',
    unitPrice:'unit_price',discount:'discount',total:'total',amountPaid:'amount_paid',remaining:'remaining',

  invoices:{invoiceNumber:'invoice_number',paymentId:'payment_id',studentId:'student_id',
    studentName:'student_name',subject:'subject',level:'level',paymentType:'payment_type',
    periodStart:'period_start',periodEnd:'period_end',meetingNumber:'meeting_number',
    quantity:'quantity',month:'month',date:'date',paymentDate:'payment_date',
    unitPrice:'unit_price',subtotal:'subtotal',discount:'discount',total:'total',
    amountPaid:'amount_paid',remainingAmount:'remaining_amount',method:'method',
    status:'status',notes:'notes',createdAt:'created_at',voidReason:'void_reason'},
  notes:{studentId:'student_id',date:'date',title:'title',content:'content'},
  settings:{value:'value'}
};

function toDb(table,obj){
  const map=FIELD_MAP[table]||{}, row={};
  for(const [k,v] of Object.entries(obj||{})) row[map[k]||k]=v;
  return row;
}
function fromDb(table,row){
  const map=FIELD_MAP[table]||{};
  const reverse=Object.fromEntries(Object.entries(map).map(([a,b])=>[b,a]));
  const obj={};
  for(const [k,v] of Object.entries(row||{})) obj[reverse[k]||k]=v;
  return obj;
}

async function sbRequest(table, options={}){
  const url = SUPABASE_URL + "/rest/v1/" + encodeURIComponent(TABLES[table]||table);
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Accept": "application/json",
    ...(options.headers||{})
  };
  const response = await fetch(url, {...options, headers});
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch {}
  if(!response.ok){
    const msg = data?.message || data?.hint || data?.details || text || response.statusText;
    throw new Error(`Supabase ${response.status}: ${msg}`);
  }
  return data;
}

async function all(table){
  const base = SUPABASE_URL + "/rest/v1/" + encodeURIComponent(TABLES[table]||table);
  const url = base + "?select=*";
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Accept": "application/json",
    "Cache-Control": "no-cache",
    "Pragma": "no-cache"
  };
  const response = await fetch(url,{method:"GET",headers,cache:"no-store"});
  const text = await response.text();
  let data=null; try{data=text?JSON.parse(text):null}catch{}
  if(!response.ok){
    const msg=data?.message||data?.hint||data?.details||text||response.statusText;
    throw new Error(`Supabase ${response.status}: ${msg}`);
  }
  return (data||[]).map(x=>fromDb(table,x));
}

async function put(table,obj){
  const row=toDb(table,obj);
  const tableName=TABLES[table]||table;
  const base=SUPABASE_URL+"/rest/v1/"+encodeURIComponent(tableName);
  const headers={
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    "Accept":"application/json"
  };

  // The app generates an ID for both new and existing records.
  // Therefore, first check whether that ID already exists.
  if(obj && obj.id){
    const checkResponse=await fetch(base+"?id=eq."+encodeURIComponent(String(obj.id))+"&select=id",{
      method:"GET",
      headers
    });
    const checkText=await checkResponse.text();
    let checkData=null; try{checkData=checkText?JSON.parse(checkText):null}catch{}
    if(!checkResponse.ok){
      const msg=checkData?.message||checkData?.hint||checkData?.details||checkText||checkResponse.statusText;
      throw new Error(`Supabase CHECK ${checkResponse.status}: ${msg}`);
    }

    const exists=Array.isArray(checkData) && checkData.length>0;

    if(exists){
      console.log("[Supabase] UPDATE",tableName,"id=",obj.id,row);
      const response=await fetch(base+"?id=eq."+encodeURIComponent(String(obj.id)),{
        method:"PATCH",
        headers:{...headers,"Prefer":"return=representation"},
        body:JSON.stringify(row)
      });
      const text=await response.text();
      let data=null; try{data=text?JSON.parse(text):null}catch{}
      if(!response.ok){
        const msg=data?.message||data?.hint||data?.details||text||response.statusText;
        throw new Error(`Supabase UPDATE ${response.status}: ${msg}`);
      }
      if(Array.isArray(data) && data.length) return fromDb(table,data[0]);
      return fromDb(table,row);
    }
  }

  console.log("[Supabase] INSERT",tableName,row);
  const response=await fetch(base,{
    method:"POST",
    headers:{...headers,"Prefer":"return=representation"},
    body:JSON.stringify(row)
  });
  const text=await response.text();
  let data=null; try{data=text?JSON.parse(text):null}catch{}
  if(!response.ok){
    const msg=data?.message||data?.hint||data?.details||text||response.statusText;
    throw new Error(`Supabase INSERT ${response.status}: ${msg}`);
  }
  return fromDb(table,(data||[])[0]||row);
}
async function del(table,id){
  await sbRequest(table,{
    method:"DELETE",
    headers:{"Prefer":"return=minimal"},
    body:undefined
  });
  // Supabase REST requires the filter in the URL; the request above is replaced
  // below by a filtered DELETE for compatibility.
}

async function deleteRow(table,id){
  const url=SUPABASE_URL+"/rest/v1/"+encodeURIComponent(TABLES[table]||table)+"?id=eq."+encodeURIComponent(String(id));
  console.log("[Supabase] DELETE",TABLES[table]||table,"id=",id);
  const response=await fetch(url,{
    method:"DELETE",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Accept":"application/json",
      "Prefer":"return=representation"
    },
    cache:"no-store"
  });
  const text=await response.text();
  let data=null; try{data=text?JSON.parse(text):null}catch{}
  if(!response.ok){
    const msg=data?.message||data?.hint||data?.details||text||response.statusText;
    throw new Error(`Supabase DELETE ${response.status}: ${msg}`);
  }
  console.log("[Supabase] DELETE RESULT",data);
  if(!Array.isArray(data) || data.length===0){
    throw new Error("Supabase tidak menghapus baris. Kemungkinan ID tidak cocok atau policy DELETE/RLS belum mengizinkan penghapusan.");
  }
  return data.map(x=>fromDb(table,x));
}

// Keep the application's existing del() calls working.
async function del(table,id){ return deleteRow(table,id); }

async function setting(k,def=''){
  const a=await all('settings');

    setTimeout(()=>{if(typeof toast==='function')toast("Supabase belum dapat diakses: "+e.message);},800);
    return false;
  }
}

// =========================
// SUPABASE STORAGE: PAYMENT PROOFS
// =========================
const PAYMENT_PROOF_BUCKET='payment-proofs';
const PAYMENT_PROOF_MAX_SIZE=5*1024*1024;
const PAYMENT_PROOF_TYPES=['image/jpeg','image/png','image/webp'];
const PAYMENT_PROOF_SETTING_PREFIX='paymentProof:';

function paymentProofKey(paymentId){return PAYMENT_PROOF_SETTING_PREFIX+String(paymentId)}
async function getPaymentProofPath(paymentId){return paymentId?await setting(paymentProofKey(paymentId),''):''}

function storagePathUrl(path){return String(path||'').split('/').map(encodeURIComponent).join('/')}

async function uploadPaymentProof(file,paymentId){
  if(!file)return '';
  if(!PAYMENT_PROOF_TYPES.includes(file.type))throw new Error('Bukti pembayaran harus JPG, PNG, atau WebP.');
  if(file.size>PAYMENT_PROOF_MAX_SIZE)throw new Error('Ukuran bukti pembayaran maksimal 5 MB.');
  const original=(file.name||'bukti').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-80)||'bukti';
  const path='payments/'+String(paymentId)+'/'+Date.now()+'_'+original;
  const url=SUPABASE_URL+'/storage/v1/object/'+PAYMENT_PROOF_BUCKET+'/'+storagePathUrl(path);
  const response=await fetch(url,{method:'POST',headers:{
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY,
    'Content-Type':file.type,
    'x-upsert':'false'
  },body:file});
  const text=await response.text();
  if(!response.ok)throw new Error('Upload bukti pembayaran gagal: '+(text||response.statusText));
  return path;
}

async function deletePaymentProofPath(path){
  if(!path)return;
  const url=SUPABASE_URL+'/storage/v1/object/'+PAYMENT_PROOF_BUCKET;
  const response=await fetch(url,{method:'DELETE',headers:{
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json'
  },body:JSON.stringify([path])});
  const text=await response.text();
  if(!response.ok)throw new Error('Gagal menghapus file bukti pembayaran: '+(text||response.statusText));
}

async function savePaymentProofPath(paymentId,path){await setSetting(paymentProofKey(paymentId),path||'')}
async function removePaymentProof(paymentId){
  const path=await getPaymentProofPath(paymentId);
  if(path){await deletePaymentProofPath(path);}
  try{await del('settings',paymentProofKey(paymentId));}catch(e){console.warn('[Payment Proof] metadata tidak ditemukan/terhapus:',e.message)}
}

async function getSignedPaymentProofUrl(path){
  if(!path)return '';
  const url=SUPABASE_URL+'/storage/v1/object/sign/'+PAYMENT_PROOF_BUCKET;
  const response=await fetch(url,{method:'POST',headers:{
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json'
  },body:JSON.stringify({expiresIn:3600,paths:[path]})});
  const text=await response.text();
  let data=null;try{data=text?JSON.parse(text):null}catch{}
  if(!response.ok)throw new Error('Gagal membuat link bukti pembayaran: '+(data?.message||text||response.statusText));
  const signed=data?.signedURLs?.[0]?.signedURL||data?.signedURL||data?.signedUrl||'';
  if(!signed)throw new Error('Supabase tidak mengembalikan link bukti pembayaran.');
  return signed.startsWith('http')?signed:SUPABASE_URL+'/storage/v1'+signed;
}

function paymentProofLabel(path){return path?'📎 Ada bukti':'-'}
async function openPayment(refId='', forceStudent=false){
  const ss=await all('students');
  if(!ss.length)return toast('Tambahkan siswa terlebih dahulu.');

  const paymentsData=await all('payments');
  const existing=(!forceStudent && refId)?paymentsData.find(x=>String(x.id)===String(refId)):null;
  const editing=!!existing;
  const selectedStudentId=editing?existing.studentId:(refId && ss.some(x=>String(x.id)===String(refId))?refId:ss[0].id);
  const selectedStudent=ss.find(x=>String(x.id)===String(selectedStudentId))||ss[0];

  modal(editing?'Edit Pembayaran':'Tambah Pembayaran',`<form id="payForm"><div class="formgrid">
<div class="field full"><label>Siswa *</label><select class="select" name="studentId" id="payStudent">${ss.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(selectedStudentId)?'selected':''}>${esc(x.name)} — ${esc(x.subject)} ${x.level?'• '+esc(x.level):''}</option>`).join('')}</select></div>
<div class="field"><label>Jenis Pembayaran</label><select class="select" name="paymentType" id="payType">${opts(paymentTypes,existing?.paymentType||selectedStudent.paymentType||'Per Meeting')}</select></div>
${formField('Tanggal Pembayaran','date',existing?.date||today(),'date')}
${formField('Periode Awal','periodStart',existing?.periodStart||today(),'date')}${formField('Periode Akhir','periodEnd',existing?.periodEnd||today(),'date')}
${formField('Pertemuan Ke-','meetingNumber',existing?.meetingNumber??'','number')}${formField('Jumlah Meeting','quantity',existing?.quantity??'1','number')}
${formField('Bulan (YYYY-MM)','month',existing?.month||today().slice(0,7),'month')}${formField('Tarif','unitPrice',existing?.unitPrice??'','number','min="0" step="1"')}
${formField('Diskon','discount',existing?.discount??'0','number','min="0" step="1"')}${formField('Nominal Dibayar','amountPaid',existing?.amountPaid??'','number','min="0" step="1"')}
<div class="field"><label>Metode</label><select class="select" name="method">${opts(['Cash','Transfer','QRIS','Lainnya'],existing?.method||'Cash')}</select></div>
<div class="field full"><label>Catatan</label><textarea class="textarea" name="notes">${esc(existing?.notes||'')}</textarea></div>
<div class="field full"><label>📎 Bukti Pembayaran</label><input class="input" id="paymentProofFile" type="file" accept="image/jpeg,image/png,image/webp"><small id="paymentProofInfo" style="display:block;margin-top:7px;color:var(--muted)">${editing?'Memuat status bukti pembayaran...':'Opsional • JPG/PNG/WebP • Maks. 5 MB'}</small></div>
</div><div class="notice" id="payHint"></div><div class="modalfoot"><button type="button" class="btn gray" onclick="closeModal()">Batal</button><button class="btn green">${editing?'Simpan Perubahan':'Simpan & Buat Invoice'}</button></div></form>`);

  const studentEl=document.getElementById('payStudent');
  const typeEl=document.getElementById('payType');
  const tariffEl=document.querySelector('#payForm [name="unitPrice"]');
  const qtyEl=document.querySelector('#payForm [name="quantity"]');
  const discountEl=document.querySelector('#payForm [name="discount"]');
  const paidEl=document.querySelector('#payForm [name="amountPaid"]');
  const hintEl=document.getElementById('payHint');
  const proofFileEl=document.getElementById('paymentProofFile');
  const proofInfoEl=document.getElementById('paymentProofInfo');
  const existingProofPath=editing?await getPaymentProofPath(existing.id):'';
  let selectedProofFile=null;
  let existingProof=existingProofPath;
  if(existingProof){proofInfoEl.innerHTML='Bukti tersimpan di Supabase Storage. <button type="button" class="btn small light" id="viewExistingProofBtn">Lihat</button> <span style="color:var(--muted)">• pilih file baru untuk mengganti</span>';document.getElementById('viewExistingProofBtn').onclick=async()=>{try{const u=await getSignedPaymentProofUrl(existingProof);window.open(u,'_blank','noopener');}catch(e){toast(e.message)}}}
  proofFileEl.onchange=()=>{const f=proofFileEl.files?.[0];selectedProofFile=null;if(!f){if(existingProof)proofInfoEl.textContent='Bukti tersimpan di Supabase Storage. Pilih file baru untuk mengganti.';return;}if(!PAYMENT_PROOF_TYPES.includes(f.type)){toast('Bukti pembayaran harus JPG, PNG, atau WebP.');proofFileEl.value='';return;}if(f.size>PAYMENT_PROOF_MAX_SIZE){toast('Ukuran bukti pembayaran maksimal 5 MB.');proofFileEl.value='';return;}selectedProofFile=f;proofInfoEl.textContent='File baru dipilih: '+f.name+' • '+(f.size/1024/1024).toFixed(2)+' MB';};

  // IMPORTANT: when editing, the values already stored in Supabase are kept.
  // Automatic tariff suggestion is only used for a NEW payment or when the
  // user changes student/payment type. Manual tariff edits are never overwritten.
  let tariffReady=editing;

  function recalcHint(){
    const type=typeEl.value;
    const price=Math.max(0,Number(tariffEl.value||0));
    const qty=Math.max(1,Number(qtyEl.value||1));
    const discount=Math.max(0,Number(discountEl.value||0));
    const subtotal=type==='Per Meeting'?price*qty:price;
    const total=Math.max(0,subtotal-discount);
    const paid=Math.max(0,Number(paidEl.value||0));
    const remaining=Math.max(0,total-paid);
    hintEl.textContent='Tarif: '+money(price)+' • Subtotal: '+money(subtotal)+' • Total: '+money(total)+' • Dibayar: '+money(paid)+' • Sisa: '+money(remaining);
  }

  async function suggestTariff(force=false){
    const st=(await all('students')).find(x=>String(x.id)===String(studentEl.value));
    if(!st)return recalcHint();
    const rate=await getRate(st.subject,st.level,typeEl.value);
    const suggested=(st.customPrice!=='' && st.customPrice!=null)?Number(st.customPrice):Number(rate||0);
    // Never overwrite an existing value during edit unless the student/type was changed.
    if(force || !tariffEl.value) tariffEl.value=suggested||'';
    tariffReady=true;
    recalcHint();
  }

  studentEl.addEventListener('change',()=>suggestTariff(true));
  typeEl.addEventListener('change',()=>suggestTariff(true));
  [tariffEl,qtyEl,discountEl,paidEl].forEach(el=>el.addEventListener('input',recalcHint));

  // Existing payment: show exactly what is stored. New payment: fill tariff once.
  if(!tariffReady) await suggestTariff(false);
  else recalcHint();

  document.getElementById('payForm').onsubmit=async e=>{
    e.preventDefault();
    try{
      const f=new FormData(e.target),o=Object.fromEntries(f.entries());
      const stu=(await all('students')).find(x=>String(x.id)===String(o.studentId));
      if(!stu)return toast('Siswa tidak ditemukan.');

      const unitPrice=Math.max(0,Number(o.unitPrice||0));
      const quantity=Math.max(1,Number(o.quantity||1));
      const discount=Math.max(0,Number(o.discount||0));
      const calculatedSubtotal=o.paymentType==='Per Meeting'?unitPrice*quantity:unitPrice;
      const total=Math.max(0,calculatedSubtotal-discount);
      const amountPaid=Math.max(0,Number(o.amountPaid||0));
      const remaining=Math.max(0,total-amountPaid);

      const payment={
        id:existing?.id||uid(),
        studentId:stu.id,
        studentName:stu.name,
        className:existing?.className||'',
        subject:stu.subject,
        level:stu.level,
        paymentType:o.paymentType,
        periodStart:o.periodStart||null,
        periodEnd:o.periodEnd||null,
        meetingNumber:o.meetingNumber===''?null:Number(o.meetingNumber),
        quantity,
        month:o.month||null,
        unitPrice,
        discount,
        total,
        amountPaid,
        remaining,
        method:o.method||'Cash',
        status:amountPaid>=total?'LUNAS':amountPaid>0?'CICILAN':'BELUM LUNAS',
        date:o.date||today(),
        notes:o.notes||'',
        createdAt:existing?.createdAt||new Date().toISOString()
      };

      console.log('[Pembayaran] DATA SEBELUM UPDATE',payment);
      let newProofPath='';
      try{
        if(selectedProofFile)newProofPath=await uploadPaymentProof(selectedProofFile,payment.id);
        const savedPayment=await put('payments',payment);
        if(selectedProofFile){
          await savePaymentProofPath(payment.id,newProofPath);
          if(existingProof && existingProof!==newProofPath){try{await deletePaymentProofPath(existingProof)}catch(cleanErr){console.warn('[Payment Proof] Bukti lama gagal dihapus:',cleanErr.message)}}
          existingProof=newProofPath;
        }
      }catch(saveErr){
        if(newProofPath){try{await deletePaymentProofPath(newProofPath)}catch(cleanErr){console.warn('[Payment Proof] Cleanup gagal:',cleanErr.message)}}
        throw saveErr;
      }
      const savedPayment=(await all('payments')).find(x=>String(x.id)===String(payment.id));
      if(!savedPayment)throw new Error('Pembayaran tersimpan tetapi gagal dibaca kembali dari Supabase.');

      // Verify the values actually stored in Supabase before updating the invoice.
      const verify=(await all('payments')).find(x=>String(x.id)===String(payment.id));
      if(!verify)throw new Error('Pembayaran berhasil dikirim tetapi tidak ditemukan saat verifikasi Supabase.');
      const samePrice=Number(verify.unitPrice||0)===unitPrice;
      const samePaid=Number(verify.amountPaid||0)===amountPaid;
      const sameTotal=Number(verify.total||0)===total;
      if(!samePrice || !samePaid || !sameTotal){
        console.error('[Pembayaran] VERIFIKASI GAGAL', {expected:{unitPrice,amountPaid,total},actual:{unitPrice:verify.unitPrice,amountPaid:verify.amountPaid,total:verify.total}});
        throw new Error('Supabase tidak menyimpan Tarif/Nominal Dibayar/Total sesuai nilai yang dimasukkan. Periksa RLS/policy tabel payments.');
      }

      await syncInvoiceFromPayment(verify);
      closeModal();
      toast(editing?'Pembayaran, tarif, nominal dibayar, dan invoice berhasil diperbarui.':'Pembayaran tersimpan & invoice dibuat.');
      if(editing)await renderPayments();
      else {
        const inv=await findInvoiceByPayment(verify.id);
        if(inv)openInvoice(inv.id); else await renderPayments();
      }
    }catch(err){
      console.error('[Pembayaran] Simpan gagal',err);
      toast('Gagal menyimpan pembayaran: '+err.message);
    }
  };
}

async function findInvoiceByPayment(paymentId){
  const invs=await all('invoices');
  return invs.find(i=>i.paymentId===paymentId)||null;
}

async function syncInvoiceFromPayment(p){
  const existingInvoice=await findInvoiceByPayment(p.id);
  const invs=await all('invoices');
  const num=existingInvoice
    ? existingInvoice.invoiceNumber
    : 'INV-BB-'+String(p.date||today()).slice(0,7).replace('-','')+'-'+String(Math.max(0,...invs.map(i=>Number((i.invoiceNumber||'').split('-').pop())||0))+1).padStart(4,'0');

  const invoice={
    id:existingInvoice?.id||uid(),
    invoiceNumber:num,
    paymentId:p.id,
    studentId:p.studentId,
    studentName:p.studentName,
    subject:p.subject,
    level:p.level,
    paymentType:p.paymentType,
    periodStart:p.periodStart||null,
    periodEnd:p.periodEnd||null,
    meetingNumber:p.meetingNumber?Number(p.meetingNumber):null,
    quantity:Number(p.quantity||1),
    month:p.month||null,
    date:p.date||today(),
    paymentDate:p.date||today(),
    unitPrice:Number(p.unitPrice||0),
    subtotal:(p.paymentType==='Per Meeting'?Number(p.unitPrice||0)*Number(p.quantity||1):Number(p.unitPrice||0)),
    discount:Number(p.discount||0),
    total:Number(p.total||0),
    amountPaid:Number(p.amountPaid||0),
    remainingAmount:Number(p.remaining||0),
    method:p.method||'Cash',
    status:p.status||'BELUM LUNAS',
    notes:p.notes||'',
    createdAt:existingInvoice?.createdAt||new Date().toISOString(),
    voidReason:existingInvoice?.voidReason||null
  };

  // Editing a payment re-opens its invoice unless the invoice was intentionally VOIDed.
  if(invoice.status!=='VOID')invoice.voidReason=null;
  return put('invoices',invoice);
}

async function createInvoice(p){ return syncInvoiceFromPayment(p); }

async function deletePayment(id){
  const p=(await all('payments')).find(x=>x.id===id);
  if(!p)return toast('Pembayaran tidak ditemukan.');
  if(!confirm('Hapus pembayaran ini beserta invoice dan bukti pembayaran terkait?'))return;
  try{
    const inv=await findInvoiceByPayment(id);
    const proof=await getPaymentProofPath(id);
    if(inv)await del('invoices',inv.id);
    await del('payments',id);
    if(proof){try{await deletePaymentProofPath(proof)}catch(e){console.warn('[Payment Proof] File gagal dihapus:',e.message)}}
    try{await del('settings',paymentProofKey(id))}catch(e){console.warn('[Payment Proof] Metadata gagal dihapus:',e.message)}
    toast('Pembayaran, invoice, dan bukti pembayaran berhasil dihapus.');
    await renderPayments();
  }catch(e){
    console.error(e);
    toast('Gagal menghapus pembayaran: '+e.message);
  }
}

async function copyPaymentText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast('Nomor rekening berhasil disalin.');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('Nomor rekening berhasil disalin.');
  }
}

async function filterInvoices(v){
  await renderInvoices();
  const select=document.getElementById('invoiceStatusFilter');
  if(select)select.value=v||'';
  if(!v)return;
  const tbody=invoices.querySelector('tbody');
  let ins=await all('invoices');
  const q=state.invoiceSearch.toLowerCase();
  ins=ins.filter(i=>i.status===v && Object.values(i).join(' ').toLowerCase().includes(q));
  ins.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  tbody.innerHTML=ins.map(i=>`<tr><td><b>${esc(i.invoiceNumber)}</b></td><td>${esc(i.date||'-')}</td><td>${esc(i.studentName||'-')}</td><td>${esc(i.subject||'-')} ${i.level?'• '+esc(i.level):''}</td><td>${money(i.total)}</td><td>${money(i.amountPaid)}</td><td>${money(i.remainingAmount)}</td><td><span class="badge ${i.status==='LUNAS'?'paid':i.status==='CICILAN'?'partial':'unpaid'}">${esc(i.status)}</span></td><td><button class="btn small light" onclick="openInvoice('${i.id}')">Lihat</button> <button class="btn small light" onclick="openPaymentByInvoice('${i.id}')">Edit</button> <button class="btn small red" onclick="deleteInvoice('${i.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Tidak ada data.</td></tr>';

async function openPaymentByInvoice(invoiceId){
  const i=(await all('invoices')).find(x=>x.id===invoiceId);
  if(!i)return toast('Invoice tidak ditemukan.');
  const p=await findInvoicePayment(i);
  if(!p)return toast('Pembayaran terkait invoice tidak ditemukan.');
  openPayment(p.id);
}

async function findInvoicePayment(invoice){
  const paymentsData=await all('payments');
  return paymentsData.find(p=>p.id===invoice.paymentId)||null;
}

async function deleteInvoice(id){
  const i=(await all('invoices')).find(x=>x.id===id);
  if(!i)return toast('Invoice tidak ditemukan.');
  if(!confirm('Hapus invoice ini beserta pembayaran terkait?'))return;
  try{
    const p=await findInvoicePayment(i);
    if(p){
      const proof=await getPaymentProofPath(p.id);
      await del('payments',p.id);
      if(proof){try{await deletePaymentProofPath(proof)}catch(e){console.warn('[Payment Proof] File gagal dihapus:',e.message)}}
      try{await del('settings',paymentProofKey(p.id))}catch(e){console.warn('[Payment Proof] Metadata gagal dihapus:',e.message)}
    }
    await del('invoices',id);
    toast('Invoice dan pembayaran terkait berhasil dihapus.');
    await renderInvoices();
  }catch(e){
    console.error(e);
    toast('Gagal menghapus invoice: '+e.message);
  }
}

async function voidInvoice(id){
  const reason=prompt('Alasan pembatalan invoice:');
  if(!reason)return;
  try{
    const i=(await all('invoices')).find(x=>x.id===id);
    if(!i)return toast('Invoice tidak ditemukan.');
    i.status='VOID';
    i.voidReason=reason;
    await put('invoices',i);
    const p=await findInvoicePayment(i);
    if(p){p.status='VOID';await put('payments',p);}
    toast('Invoice dan pembayaran terkait di-VOID.');
    await openInvoice(id);
  }catch(e){
    console.error(e);
    toast('Gagal melakukan VOID: '+e.message);
  }
}

  schedule.innerHTML=`<div class="title"><div><h1>Jadwal</h1><div class="subtitle">Jadwal kelas bimbel</div></div><button class="btn green" onclick="openClass()">+ Tambah Jadwal/Kelas</button></div><div class="cards">${['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'].map(d=>`<div class="card"><b>${d}</b>${cs.filter(c=>c.day===d).map(c=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-weight:700">${esc(c.startTime)}–${esc(c.endTime)}</div><b>${esc(c.className)}</b><br><small>${esc(c.subject)} ${c.level?'• '+esc(c.level):''}</small><br><small>👤 ${esc(c.teacher||'-')} • 🚪 ${esc(c.room||'-')}</small><div style="margin-top:8px;display:flex;gap:6px"><button class="btn small light" onclick="openClass('${c.id}')">Edit</button><button class="btn small red" onclick="deleteClass('${c.id}').then(()=>renderSchedule())">Hapus</button></div></div>`).join('')||'<small style="color:var(--muted)">Tidak ada jadwal</small>'}</div>`).join('')}</div>`
}
async function renderAttendance(){let [cs,ss,aa]=await Promise.all([all('classes'),all('students'),all('attendance')]);let cls=cs.find(c=>c.id===state.attendanceClass);let rows=cls?ss.filter(s=>s.status==='Aktif'):[];attendance.innerHTML=`<div class="title"><div><h1>Presensi / Absensi</h1><div class="subtitle">Catat kehadiran siswa per kelas</div></div></div><div class="toolbar"><input class="input" style="max-width:170px" type="date" value="${state.attendanceDate}" onchange="state.attendanceDate=this.value;renderAttendance()"><select class="select" style="max-width:260px" onchange="state.attendanceClass=this.value;renderAttendance()"><option value="">Pilih kelas...</option>${cs.map(c=>`<option value="${c.id}" ${c.id===state.attendanceClass?'selected':''}>${esc(c.className)} — ${esc(c.subject)}</option>`).join('')}</select>${cls?'<button class="btn green" onclick="markAllPresent()">Hadir Semua</button>':''}</div>${cls?`<div class="tablewrap"><table class="table"><thead><tr><th>Siswa</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alpa</th><th>Catatan</th></tr></thead><tbody>${rows.map(s=>{let a=aa.find(x=>x.date===state.attendanceDate&&x.classId===cls.id&&x.studentId===s.id);return `<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.studentCode)}</small></td>${['HADIR','IZIN','SAKIT','ALPA'].map(st=>`<td><input type="radio" name="att-${s.id}" value="${st}" ${a?.status===st?'checked':''}></td>`).join('')}<td><input class="input" id="note-${s.id}" value="${esc(a?.notes||'')}" placeholder="Catatan"></td></tr>`}).join('')}</tbody></table></div><div style="margin-top:12px"><button class="btn green" onclick="saveAttendance('${cls.id}')">Simpan Absensi</button></div>`:'<div class="card empty">Pilih kelas untuk mulai absensi.</div>'}<div class="card" style="margin-top:14px"><b>Rekap Kehadiran Siswa</b><div style="overflow:auto;margin-top:10px"><table class="table"><thead><tr><th>Siswa</th><th>Total</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alpa</th><th>%</th></tr></thead><tbody>${ss.map(s=>{let x=aa.filter(a=>a.studentId===s.id),h=x.filter(a=>a.status==='HADIR').length;return `<tr><td>${esc(s.name)}</td><td>${x.length}</td><td>${h}</td><td>${x.filter(a=>a.status==='IZIN').length}</td><td>${x.filter(a=>a.status==='SAKIT').length}</td><td>${x.filter(a=>a.status==='ALPA').length}</td><td>${x.length?Math.round(h/x.length*100):0}%</td></tr>`}).join('')}</tbody></table></div></div>`}
async function markAllPresent(){let cs=await all('classes'),ss=await all('students'),c=cs.find(x=>x.id===state.attendanceClass);if(!c)return;for(let s of ss.filter(s=>s.status==='Aktif')){let aa=await all('attendance'),old=aa.find(a=>a.date===state.attendanceDate&&a.classId===c.id&&a.studentId===s.id);await put('attendance',{id:old?.id||uid(),date:state.attendanceDate,classId:c.id,studentId:s.id,studentName:s.name,className:c.className,status:'HADIR',notes:old?.notes||''})}toast('Semua siswa ditandai hadir.');renderAttendance()}
async function saveAttendance(cid){let ss=await all('students'),aa=await all('attendance'),rows=ss.filter(s=>s.status==='Aktif');for(let s of rows){let r=document.querySelector(`input[name="att-${s.id}"]:checked`);if(!r)continue;let old=aa.find(a=>a.date===state.attendanceDate&&a.classId===cid&&a.studentId===s.id);await put('attendance',{id:old?.id||uid(),date:state.attendanceDate,classId:cid,studentId:s.id,studentName:s.name,className:(await all('classes')).find(c=>c.id===cid)?.className||'',status:r.value,notes:document.getElementById('note-'+s.id)?.value||''})}toast('Absensi berhasil disimpan.');renderAttendance()}
async function renderReports(){let ins=await all('invoices'),paid=ins.filter(i=>i.status==='LUNAS');let now=new Date(),month=now.toISOString().slice(0,7),mi=paid.filter(i=>i.date?.slice(0,7)===month),total=mi.reduce((a,i)=>a+i.total,0);let days=[];for(let d=6;d>=0;d--){let x=new Date();x.setDate(x.getDate()-d);let ds=x.toISOString().slice(0,10);days.push({d:ds,v:paid.filter(i=>i.date===ds).reduce((a,i)=>a+i.total,0)})}let max=Math.max(1,...days.map(x=>x.v));reports.innerHTML=`<div class="title"><div><h1>Laporan Keuangan</h1><div class="subtitle">Pendapatan hanya menghitung invoice LUNAS</div></div><button class="btn green" onclick="exportCSV()">📊 Export CSV</button></div><div class="cards"><div class="card stat"><div class="label">BULAN INI</div><div class="value" style="font-size:19px">${money(total)}</div></div><div class="card stat"><div class="label">INVOICE LUNAS</div><div class="value">${mi.length}</div></div><div class="card stat"><div class="label">CICILAN</div><div class="value">${ins.filter(i=>i.status==='CICILAN').length}</div></div><div class="card stat"><div class="label">BELUM LUNAS</div><div class="value">${ins.filter(i=>i.status==='BELUM LUNAS').length}</div></div></div><div class="grid2"><div class="card"><b>Pendapatan 7 Hari Terakhir</b><div class="chart">${days.map(x=>`<div class="bar" style="height:${Math.max(4,x.v/max*180)}px"><b>${x.v?money(x.v).replace('Rp',''):''}</b><span>${x.d.slice(8)}</span></div>`).join('')}</div></div><div class="card"><b>Rekap Metode Pembayaran</b><div style="margin-top:12px">${['Cash','Transfer','QRIS','Lainnya'].map(m=>{let v=paid.filter(i=>i.method===m).reduce((a,i)=>a+i.total,0);return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${m}</span><b>${money(v)}</b></div>`}).join('')}</div></div></div><div class="card" style="margin-top:14px"><b>Rekap Mata Pelajaran</b><table class="table" style="margin-top:10px;min-width:0"><thead><tr><th>Mata Pelajaran</th><th>Pendapatan</th><th>Invoice</th></tr></thead><tbody>${subjects.map(s=>{let x=mi.filter(i=>i.subject===s);return `<tr><td>${s}</td><td>${money(x.reduce((a,i)=>a+i.total,0))}</td><td>${x.length}</td></tr>`}).join('')}</tbody></table></div>`}
async function exportCSV(){let ins=await all('invoices');let h=['Tanggal','Nomor Invoice','Nama Siswa','ID Siswa','Mata Pelajaran','Level','Jenis Pembayaran','Periode','Subtotal','Diskon','Total','Dibayar','Sisa','Metode','Status'];let rows=ins.map(i=>[i.date,i.invoiceNumber,i.studentName,i.studentId,i.subject,i.level||'',i.paymentType,i.periodStart||i.month||'',i.subtotal,i.discount,i.total,i.amountPaid,i.remainingAmount,i.method,i.status]);downloadBlob([h,...rows].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\\n'),'Laporan_Keuangan.csv','text/csv;charset=utf-8');toast('CSV berhasil dibuat.')}
function downloadBlob(data,name,type){let b=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function renderNotes(){let [ns,ss]=await Promise.all([all('notes'),all('students')]);notes.innerHTML=`<div class="title"><div><h1>Catatan Perkembangan</h1></div><button class="btn green" onclick="openNote()">+ Catatan</button></div><div class="grid2">${ns.sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="card"><small>${esc(n.date)}</small><h3 style="margin:6px 0">${esc(n.title)}</h3><b>${esc(ss.find(s=>s.id===n.studentId)?.name||'-')}</b><p>${esc(n.content)}</p></div>`).join('')||'<div class="card empty">Belum ada catatan.</div>'}</div>`}
async function openNote(){let ss=await all('students');modal('Tambah Catatan',`<form id="noteForm"><div class="formgrid"><div class="field full"><label>Siswa</label><select class="select" name="studentId">${ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>${formField('Tanggal','date',today(),'date')}${formField('Judul','title','Perkembangan Belajar')}<div class="field full"><label>Isi Catatan</label><textarea class="textarea" name="content" rows="6"></textarea></div></div><div class="modalfoot"><button type="button" class="btn gray" onclick="closeModal()">Batal</button><button class="btn green">Simpan</button></div></form>`);document.getElementById('noteForm').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=uid();await put('notes',o);closeModal();toast('Catatan disimpan.');renderNotes()}}
async function renderPaymentSettings(){
  const cfg=await setting('paymentMethods',{bankName:'',accountNumber:'',accountName:'',qris:'',instructions:''});
  paymentSettings.innerHTML=`<div class="title"><div><h1>Pengaturan Pembayaran</h1><div class="subtitle">Atur rekening transfer dan QRIS yang akan ditampilkan kepada siswa/orang tua.</div></div></div>
  <div class="card"><h3>🏦 Transfer Bank</h3><div class="grid2">
    ${formField('Nama Bank','bankName',cfg.bankName||'')}
    ${formField('Nomor Rekening','accountNumber',cfg.accountNumber||'')}
    ${formField('Atas Nama','accountName',cfg.accountName||'')}
  </div></div>
  <div class="card" style="margin-top:14px"><h3>📱 QRIS</h3>
    <div class="field"><label>Gambar QRIS</label><input class="input" id="paymentQrisFile" type="file" accept="image/*"></div>
    <div id="paymentQrisPreview" style="margin-top:12px">${cfg.qris?`<img src="${cfg.qris}" alt="QRIS" style="max-width:280px;max-height:280px;object-fit:contain;border:1px solid var(--line);border-radius:12px;padding:8px">`:'<small style="color:var(--muted)">Belum ada gambar QRIS.</small>'}</div>
    <small style="display:block;margin-top:8px;color:var(--muted)">Untuk keamanan dan kemudahan, QRIS disimpan sebagai bagian dari pengaturan aplikasi. Gunakan gambar yang jelas dan sebaiknya tidak lebih dari 1 MB.</small>
  </div>
  <div class="card" style="margin-top:14px"><h3>📝 Instruksi Pembayaran</h3>
    <textarea class="textarea" id="paymentInstructions" rows="5" placeholder="Contoh: Setelah transfer/QRIS, kirim bukti pembayaran kepada admin.">${esc(cfg.instructions||'')}</textarea>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn green" id="savePaymentSettingsBtn">💾 Simpan Pengaturan Pembayaran</button></div>`;

  const file=document.getElementById('paymentQrisFile');
  const preview=document.getElementById('paymentQrisPreview');
  let qris=cfg.qris||'';
  file.onchange=()=>{
    const f=file.files?.[0];
    if(!f)return;
    if(!f.type.startsWith('image/')){toast('File QRIS harus berupa gambar.');file.value='';return;}
    if(f.size>1024*1024){toast('Ukuran gambar QRIS maksimal 1 MB.');file.value='';return;}
    const reader=new FileReader();
    reader.onload=()=>{qris=reader.result;preview.innerHTML=`<img src="${qris}" alt="QRIS" style="max-width:280px;max-height:280px;object-fit:contain;border:1px solid var(--line);border-radius:12px;padding:8px">`};
    reader.readAsDataURL(f);
  };

  document.getElementById('savePaymentSettingsBtn').onclick=async()=>{
    try{
      const data={
        bankName:document.querySelector('#paymentSettings [name="bankName"]').value.trim(),
        accountNumber:document.querySelector('#paymentSettings [name="accountNumber"]').value.trim(),
        accountName:document.querySelector('#paymentSettings [name="accountName"]').value.trim(),
        qris:qris||'',
        instructions:document.getElementById('paymentInstructions').value.trim()
      };
      await setSetting('paymentMethods',data);
      toast('Pengaturan pembayaran berhasil disimpan ke Supabase.');
    }catch(e){
      console.error(e);
      toast('Gagal menyimpan pengaturan pembayaran: '+e.message);
    }
  };
}
async function renderSettings(){let biz=await setting('businessName','Bengkel Bahasa'),tag=await setting('tagline','Learning & Administration'),address=await setting('address',''),phone=await setting('phone',''),wa=await setting('whatsapp',''),email=await setting('email',''),owner=await setting('ownerName',''),foot=await setting('invoiceFooter','Terima kasih telah belajar bersama Bengkel Bahasa.'),rates=(await all('settings')).find(x=>x.id==='rates')?.value||{};settings.innerHTML=`<div class="title"><div><h1>Pengaturan</h1><div class="subtitle">Identitas bimbel dan tarif</div></div></div><div class="card"><h3>Identitas Bimbel</h3><form id="settingForm"><div class="setting-row">${formField('Nama Bimbel','businessName',biz)}${formField('Tagline','tagline',tag)}${formField('Alamat','address',address)}${formField('Nomor HP','phone',phone)}${formField('WhatsApp','whatsapp',wa)}${formField('Email','email',email,'email')}${formField('Nama Pengelola','ownerName',owner)}<div class="field"><label>Footer Invoice</label><textarea class="textarea" name="invoiceFooter">${esc(foot)}</textarea></div></div><div class="modalfoot"><button class="btn green">Simpan Identitas</button></div></form></div><div class="card" style="margin-top:14px"><h3>Tarif Standar</h3><div class="tablewrap"><table class="table" style="min-width:600px"><thead><tr><th>Program</th><th>Per Meeting</th><th>Per Minggu</th><th>Per Bulan</th></tr></thead><tbody>${subjects.flatMap(s=>s==='Bahasa Inggris'?levels.map(l=>rateRow(s,l,rates)):rateRow(s,'',rates)).join('')}</tbody></table></div><div class="modalfoot"><button class="btn green" onclick="saveRates()">Simpan Tarif</button></div></div><div class="card" style="margin-top:14px"><b>Tema</b><p style="color:var(--muted);font-size:13px">Tampilan dibuat ringan dengan warna sage green dan navy.</p><button class="btn gray" onclick="document.body.classList.toggle('dark')">🌙 Mode</button></div>`;document.getElementById('settingForm').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));for(let k in o)await setSetting(k,o[k]);toast('Pengaturan disimpan.');renderSettings()}}
function rateRow(s,l,r){return `<tr><td>${esc(s)} ${l?'• '+esc(l):''}</td>${paymentTypes.map(t=>`<td><input class="input rate" data-key="${esc(s+'|'+l+'|'+t)}" type="number" value="${r[s+'|'+l+'|'+t]??''}" min="0" step="1" placeholder="Rp"></td>`).join('')}</tr>`}
async function saveRates(){try{let r={};document.querySelectorAll('.rate').forEach(x=>{r[x.dataset.key]=x.value===''?0:Number(x.value)});await setSetting('rates',r);toast('Tarif berhasil disimpan ke Supabase.');await renderSettings()}catch(e){console.error(e);toast('Gagal menyimpan tarif: '+e.message)}}
async function renderBackup(){backup.innerHTML=`<div class="title"><div><h1>Backup & Restore</h1><div class="subtitle">Simpan seluruh data aplikasi ke perangkat</div></div></div><div class="grid2"><div class="card"><h3>💾 Backup Data</h3><p>Semua data siswa, kelas, jadwal, absensi, pembayaran, invoice, catatan, tarif dan pengaturan akan disimpan.</p><button class="btn green" onclick="backupData()">Download Backup JSON</button></div><div class="card"><h3>📂 Restore Data</h3><p>Pilih file backup JSON yang pernah dibuat.</p><input class="input" type="file" accept=".json,application/json" onchange="restoreData(this.files[0])"><p class="danger" style="font-size:12px">Restore dapat menambahkan/mengganti data dengan ID yang sama. Backup dulu sebelum restore.</p></div></div><div class="card" style="margin-top:14px"><h3>🧹 Hapus Semua Data</h3><p>Tindakan ini tidak dapat dibatalkan. Backup terlebih dahulu.</p><button class="btn red" onclick="clearAll()">Hapus Semua Data</button></div>`}
async function backupData(){let data={version:1,date:new Date().toISOString(),data:{}};for(let s of stores)data.data[s]=await all(s);downloadBlob(JSON.stringify(data,null,2),'Backup_Bengkel_Bahasa_'+today()+'.json','application/json');toast('Backup berhasil dibuat.')}
async function restoreData(file){if(!file)return;if(!confirm('Restore data dari file ini?'))return;try{let data=JSON.parse(await file.text());for(let s of stores)for(let o of (data.data?.[s]||[]))await put(s,o);toast('Restore berhasil.');go('home')}catch(e){toast('File backup tidak valid.')}}
async function clearAll(){
  if(!confirm('Yakin menghapus SEMUA data?'))return;
  if(!confirm('Tindakan ini tidak dapat dibatalkan. Lanjutkan?'))return;
  try{
    for(const s of stores){
      const rows=await all(s);
      for(const row of rows) if(row.id!=null) await del(s,row.id);
    }
    toast('Semua data berhasil dihapus.');
    go('home');
  }catch(e){
    console.error(e);
    toast('Gagal menghapus semua data: '+e.message);
  }
}
async function init(){await openDB();await supabaseHealthCheck();let biz=await setting('businessName');if(!biz)biz='Bengkel Bahasa';let tagline=await setting('tagline','Learning & Administration');go('home');setInterval(()=>{if(document.getElementById('home').classList.contains('active'))renderHome()},60000)}
init().catch(err=>{
  console.error(err);
  toast("Aplikasi gagal terhubung ke Supabase. Periksa Console (F12).");
});
</script>
</body>
</html>
